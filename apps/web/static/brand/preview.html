<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>초희 로고 미리보기</title>
<style>
  body {
    margin: 0;
    padding: 40px 24px;
    background: #1c1814;
    color: #d4cebf;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", system-ui, sans-serif;
  }
  h1 {
    font-size: 18px;
    font-weight: 500;
    margin: 0 0 32px;
    text-align: center;
    letter-spacing: 0.04em;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: #221d18;
    border: 1px solid #2e2823;
    border-radius: 14px;
    padding: 28px 20px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .card img {
    width: 180px;
    height: 180px;
    display: block;
  }
  .label {
    font-size: 13px;
    opacity: 0.7;
    letter-spacing: 0.06em;
  }
  .sizes {
    display: flex;
    align-items: end;
    gap: 18px;
    margin-top: 8px;
  }
  .sizes img:nth-child(1) { width: 96px; height: 96px; }
  .sizes img:nth-child(2) { width: 48px; height: 48px; }
  .sizes img:nth-child(3) { width: 24px; height: 24px; }
  .row {
    margin-top: 40px;
    text-align: center;
  }
  .row h2 {
    font-size: 13px;
    font-weight: 400;
    opacity: 0.55;
    margin: 0 0 16px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <h1>초희 로고 — 원안과 변형안</h1>
  <div class="grid">
    <div class="card">
      <img src="./logo-v1.svg" alt="원안">
      <span class="label">v1 · 원안 (가사 → 음악 곡선)</span>
    </div>
    <div class="card">
      <img src="./logo-v2.svg" alt="변형안">
      <span class="label">v2 · 변형안 (직선 · 곡선 · 동그라미)</span>
    </div>
    <div class="card">
      <img src="./logo-v3.svg" alt="3안">
      <span class="label">v3 · 테두리 없음, 큰 점, 좁은 간격</span>
    </div>
  </div>

  <div class="row">
    <h2>사이즈 시뮬레이션</h2>
    <div class="sizes" style="justify-content:center">
      <img src="./logo-v3.svg" alt="">
      <img src="./logo-v3.svg" alt="">
      <img src="./logo-v3.svg" alt="">
    </div>
  </div>
</body>
</html>
